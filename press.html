<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Press</title>
<style>
  :root { --ink:#111; --muted:#555; --rule:#999; --bg:#f4f1ea; --panel:#fff; --green:#2a5d34; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; display:flex; min-height:100vh; }
  #controls { width:320px; flex:none; background:var(--panel); border-right:1px solid #ddd;
    padding:20px 18px; overflow-y:auto; }
  #back { display:inline-block; color:var(--muted); text-decoration:none; font-size:13px; margin-bottom:12px; }
  #back:hover { color:var(--ink); }
  h1 { font:600 20px/1.2 Georgia, serif; margin:0 0 2px; }
  .tag { color:var(--muted); font-size:12px; margin:0 0 16px; }
  .sec { border-top:1px solid #eee; margin-top:16px; padding-top:12px; }
  .sec-h { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 8px; }
  label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); margin:10px 0 4px; }
  select, input[type=search], input[type=text], button { width:100%; padding:8px 9px; font-size:14px;
    border:1px solid #ccc; border-radius:7px; background:#fff; font-family:inherit; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .seg button { flex:1 1 auto; min-width:54px; padding:8px 4px; cursor:pointer; background:#f7f7f7; font-size:13px; }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; font-weight:500;
    color:var(--ink); text-transform:none; letter-spacing:0; }
  .check input { width:auto; }
  .cbx { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:400; text-transform:none;
    letter-spacing:0; color:var(--ink); margin:5px 0; }
  .cbx input { width:auto; }
  input[type=range] { width:100%; }
  .refrow { display:flex; gap:6px; } .refrow input { flex:1; } .refrow button { width:auto; padding:8px 12px; cursor:pointer; }
  #print { margin-top:18px; background:var(--green); color:#fff; border:none; font-weight:600; cursor:pointer; padding:13px; }
  #print:hover { background:#234e2b; }
  .hint { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.45; }
  #status { font-size:12px; color:var(--muted); margin-top:12px; min-height:1em; }
  #status.err { color:#9a2a2a; }

  #stage { flex:1; padding:32px; overflow:auto; display:flex; justify-content:center; align-items:flex-start; }
  #page { background:#fff; color:var(--ink); box-shadow:0 6px 28px rgba(0,0,0,.16); --fs:11pt; --lh:1.5; }
  #page.serif { font-family:Georgia,"Times New Roman",serif; }
  #page.sans  { font-family:"Segoe UI",system-ui,sans-serif; }
  #page.a6 { width:105mm; padding:8mm; }
  #page.a5 { width:148mm; padding:12mm; }
  #page.a4 { width:210mm; padding:14mm; }
  #page.letter { width:216mm; padding:14mm; }
  #page.receipt { width:80mm; padding:5mm; }
  #page .ttl { text-align:center; font-weight:700; font-size:calc(var(--fs) * 1.7); margin:2px 0; line-height:1.15; }
  #page .sub { text-align:center; font-style:italic; color:var(--muted); font-size:calc(var(--fs) * .92); margin:0 0 10px; }
  #page hr { border:none; border-top:.5px solid var(--rule); width:40%; margin:10px auto; }
  #page .chap { font-weight:700; font-size:calc(var(--fs) * 1.08); margin:12px 0 3px; }
  #page .body { font-size:var(--fs); line-height:var(--lh); text-align:left; }
  #page .body.just { text-align:justify; }
  #page .line { font-size:var(--fs); line-height:var(--lh); text-align:left;
    padding-left:1.7em; text-indent:-1.7em; margin:0 0 .18em; }
  #page .line.just { text-align:justify; }
  #page .vn { font-size:.62em; vertical-align:super; line-height:0; color:#333; }
  #page .foot { text-align:center; font-size:calc(var(--fs) * .68); color:var(--muted);
    font-family:"Segoe UI",system-ui,sans-serif; margin-top:12px; }
  /* parallel table */
  #page table.par { width:100%; border-collapse:collapse; font-size:var(--fs); line-height:var(--lh); }
  #page table.par th, #page table.par td { border:.5px solid #c9c4b8; padding:5px 8px; vertical-align:top; text-align:left; }
  #page table.par th { background:#f1ede3; font-family:"Segoe UI",system-ui,sans-serif;
    font-size:calc(var(--fs) * .8); font-weight:700; }
  #page table.par td.vh, #page table.par th.vh { width:2.6em; text-align:right; color:#666;
    font-size:.82em; font-family:"Segoe UI",system-ui,sans-serif; }

  @media print {
    #controls { display:none; }
    body { background:#fff; }
    #stage { padding:0; display:block; overflow:visible; }
    #page { box-shadow:none; width:auto; }
    #page table.par th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
  <div id="controls">
    <a id="back" href="index.html">← Back to the Archive</a>
    <h1>The Press</h1>
    <p class="tag">Any text · any translation · single or parallel</p>

    <div class="sec">
      <div class="sec-h">Source</div>
      <label for="tradition">Tradition</label>
      <select id="tradition"></select>
      <label for="text">Text</label>
      <select id="text"></select>
      <label for="translation">Translation</label>
      <select id="translation"></select>
      <label class="check"><input type="checkbox" id="showall"> Show all texts (incl. unfinalized)</label>
    </div>

    <div class="sec">
      <div class="sec-h">Passage</div>
      <div id="nav"></div>
      <label for="ref">…or type a reference</label>
      <div class="refrow">
        <input type="text" id="ref" placeholder="e.g. John 3:16-18  ·  2:255  ·  5:1-10">
        <button id="refgo">Go</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">Compare translations</div>
      <div class="seg" id="modeSeg">
        <button data-mode="single" class="on">Single</button>
        <button data-mode="parallel">Parallel</button>
      </div>
      <div id="compareSec" style="display:none;">
        <label>Compare with</label>
        <div id="compare"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">Page &amp; type</div>
      <label>Size</label>
      <div class="seg" id="sizeSeg">
        <button data-size="a6" class="on">A6</button>
        <button data-size="a5">A5</button>
        <button data-size="a4">A4</button>
        <button data-size="letter">Letter</button>
        <button data-size="receipt">Receipt</button>
      </div>
      <label>Font</label>
      <div class="seg" id="famSeg">
        <button data-fam="serif" class="on">Serif</button>
        <button data-fam="sans">Sans</button>
      </div>
      <label>Layout</label>
      <div class="seg" id="layoutSeg">
        <button data-layout="flow" class="on">Flowing</button>
        <button data-layout="lines">Per verse</button>
      </div>
      <label for="fs">Text size — <span id="fsVal">11</span> pt</label>
      <input type="range" id="fs" min="8" max="18" step="0.5" value="11">
      <label for="lh">Line spacing — <span id="lhVal">1.5</span></label>
      <input type="range" id="lh" min="1.2" max="2.0" step="0.05" value="1.5">
      <label class="check"><input type="checkbox" id="justify"> Justify text</label>
    </div>

    <button id="print">Print / Save as PDF</button>
    <p class="hint">In the print dialog choose your printer — or “Save as PDF”. Match the paper size to your selection.</p>
    <p id="status">Loading the library…</p>
  </div>

  <div id="stage">
    <div id="page" class="a6 serif"><div class="ttl">—</div></div>
  </div>

<script>
const BOOK_NAMES = {gen:"Genesis",exo:"Exodus",lev:"Leviticus",num:"Numbers",deu:"Deuteronomy",jos:"Joshua",jdg:"Judges",rut:"Ruth","1sa":"1 Samuel","2sa":"2 Samuel","1ki":"1 Kings","2ki":"2 Kings","1ch":"1 Chronicles","2ch":"2 Chronicles",ezr:"Ezra",neh:"Nehemiah",est:"Esther",job:"Job",psa:"Psalms",pro:"Proverbs",ecc:"Ecclesiastes",sng:"Song of Solomon",isa:"Isaiah",jer:"Jeremiah",lam:"Lamentations",eze:"Ezekiel",dan:"Daniel",hos:"Hosea",joe:"Joel",amo:"Amos",oba:"Obadiah",jon:"Jonah",mic:"Micah",nah:"Nahum",hab:"Habakkuk",zep:"Zephaniah",hag:"Haggai",zec:"Zechariah",mal:"Malachi",mat:"Matthew",mrk:"Mark",luk:"Luke",jhn:"John",act:"Acts",rom:"Romans","1co":"1 Corinthians","2co":"2 Corinthians",gal:"Galatians",eph:"Ephesians",php:"Philippians",col:"Colossians","1th":"1 Thessalonians","2th":"2 Thessalonians","1ti":"1 Timothy","2ti":"2 Timothy",tit:"Titus",phm:"Philemon",heb:"Hebrews",jas:"James","1pe":"1 Peter","2pe":"2 Peter","1jn":"1 John","2jn":"2 John","3jn":"3 John",jud:"Jude",rev:"Revelation"};
const BOOK_LOOKUP = (()=>{ const m={}; const n=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
  for(const [a,f] of Object.entries(BOOK_NAMES)){ m[n(a)]=a; m[n(f)]=a; }
  Object.assign(m,{psalm:"psa",psalms:"psa",ps:"psa",song:"sng",songofsongs:"sng",revelations:"rev",
    matt:"mat",mk:"mrk",lk:"luk",jn:"jhn","1cor":"1co","2cor":"2co",phil:"php"}); return m; })();
const SURAH_NAMES={1:"Al-Fatihah",2:"Al-Baqarah",3:"Ali 'Imran",4:"An-Nisa'",5:"Al-Ma'idah",6:"Al-An'am",7:"Al-A'raf",8:"Al-Anfal",9:"At-Tawbah",10:"Yunus",11:"Hud",12:"Yusuf",13:"Ar-Ra'd",14:"Ibrahim",15:"Al-Hijr",16:"An-Nahl",17:"Al-Isra'",18:"Al-Kahf",19:"Maryam",20:"Ta-Ha",21:"Al-Anbiya'",22:"Al-Hajj",23:"Al-Mu'minun",24:"An-Nur",25:"Al-Furqan",26:"Ash-Shu'ara'",27:"An-Naml",28:"Al-Qasas",29:"Al-'Ankabut",30:"Ar-Rum",31:"Luqman",32:"As-Sajdah",33:"Al-Ahzab",34:"Saba'",35:"Fatir",36:"Ya-Sin",37:"As-Saffat",38:"Sad",39:"Az-Zumar",40:"Ghafir",41:"Fussilat",42:"Ash-Shura",43:"Az-Zukhruf",44:"Ad-Dukhan",45:"Al-Jathiyah",46:"Al-Ahqaf",47:"Muhammad",48:"Al-Fath",49:"Al-Hujurat",50:"Qaf",51:"Adh-Dhariyat",52:"At-Tur",53:"An-Najm",54:"Al-Qamar",55:"Ar-Rahman",56:"Al-Waqi'ah",57:"Al-Hadid",58:"Al-Mujadila",59:"Al-Hashr",60:"Al-Mumtahanah",61:"As-Saf",62:"Al-Jumu'ah",63:"Al-Munafiqun",64:"At-Taghabun",65:"At-Talaq",66:"At-Tahrim",67:"Al-Mulk",68:"Al-Qalam",69:"Al-Haqqah",70:"Al-Ma'arij",71:"Nuh",72:"Al-Jinn",73:"Al-Muzzammil",74:"Al-Muddaththir",75:"Al-Qiyamah",76:"Al-Insan",77:"Al-Mursalat",78:"An-Naba'",79:"An-Nazi'at",80:"'Abasa",81:"At-Takwir",82:"Al-Infitar",83:"Al-Mutaffifin",84:"Al-Inshiqaq",85:"Al-Buruj",86:"At-Tariq",87:"Al-A'la",88:"Al-Ghashiyah",89:"Al-Fajr",90:"Al-Balad",91:"Ash-Shams",92:"Al-Layl",93:"Ad-Duha",94:"Ash-Sharh",95:"At-Tin",96:"Al-'Alaq",97:"Al-Qadr",98:"Al-Bayyinah",99:"Az-Zalzalah",100:"Al-'Adiyat",101:"Al-Qari'ah",102:"At-Takathur",103:"Al-Asr",104:"Al-Humazah",105:"Al-Fil",106:"Quraysh",107:"Al-Ma'un",108:"Al-Kawthar",109:"Al-Kafirun",110:"An-Nasr",111:"Al-Masad",112:"Al-Ikhlas",113:"Al-Falaq",114:"An-Nas"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const TC_SMALL = new Set("of and the in to a an on at for with from by or".split(" "));
const tc = s => String(s).toLowerCase().split(/\s+/)
  .map((w,i)=> (i>0 && TC_SMALL.has(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(" ");

let WORKS = {}, TRADITIONS = [], CUR = null, override = null, mode = "single";
let FINALIZED = new Set(), SHOWALL = false;
let ancVals = [];
const TEXTCACHE = {};        // file -> {passages, byKey, title, hierarchy}
let ST = { size:"a6", fam:"serif", fs:11, lh:1.5, just:false, layout:"flow" };

function status(msg, err){ const s=$("status"); s.textContent=msg; s.className = err?"err":""; }

async function fetchJSON(path){
  const r = await fetch(path, {cache:"no-store"});
  if(!r.ok) return null;
  if(path.endsWith(".gz")){
    const stream = r.body.pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }
  return r.json();
}

async function getText(file){
  if(TEXTCACHE[file]) return TEXTCACHE[file];
  let d = await fetchJSON("data/"+file+".gz");
  if(!d) d = await fetchJSON("data/"+file);
  if(!d) return null;
  const passages = (d.passages||[]).filter(p=>Array.isArray(p.path) && p.text!=null)
                    .slice().sort((a,b)=>a.order-b.order);
  const byKey = {}; for(const p of passages) byKey[p.path.join("|")] = p.text;
  return TEXTCACHE[file] = {passages, byKey, title:d.title, hierarchy:d.hierarchy, titles:d.chapter_titles||null};
}

// ── catalog ──────────────────────────────────────────────────────────────────
async function loadCatalog(){
  let idx = await fetchJSON("data/_generated/index.json");
  if(!idx) idx = await fetchJSON("data/_generated/index.json.gz");
  if(!idx){ status("Could not load the library catalog.", true); return; }
  FINALIZED = new Set(await fetchJSON("data/finalized.json") || []);
  const texts = idx.texts || idx;
  for(const e of texts){
    const w = WORKS[e.id] || (WORKS[e.id] = {id:e.id,title:e.title,tradition:e.tradition||"Other",
      hierarchy:e.hierarchy||["section"], imp:(e.importance_rank ?? 9999), trans:[]});
    if(!w.trans.some(t=>t.file===e.data_file))
      w.trans.push({file:e.data_file, label:e.translation_label || e.title, fin:FINALIZED.has(e.data_file)});
  }
  populateTraditions();
}
function fillSelect(sel, pairs, value){
  sel.innerHTML = pairs.map(([v,t])=>`<option value="${esc(v)}"${String(v)===String(value)?" selected":""}>${esc(t)}</option>`).join("");
}
// finalized-aware visibility (toggled by "Show all texts"). If the finalized
// list failed to load, fall back to showing everything (never an empty Press).
function visTrans(w){ return (SHOWALL || !FINALIZED.size) ? w.trans : w.trans.filter(t=>t.fin); }
function workVisible(w){ return SHOWALL || !FINALIZED.size || w.trans.some(t=>t.fin); }
function populateTraditions(){
  const trads=[...new Set(Object.values(WORKS).filter(workVisible).map(w=>w.tradition))].sort();
  const def = trads.includes("Christian") ? "Christian" : trads[0];
  fillSelect($("tradition"), trads.map(t=>[t,t]), def);
  populateTexts();
}
function worksInTradition(t){
  return Object.values(WORKS).filter(w=>w.tradition===t && workVisible(w))
    .sort((a,b)=>(a.imp-b.imp)||a.title.localeCompare(b.title));
}
function populateTexts(){
  const ws = worksInTradition($("tradition").value);
  const def = ws.some(w=>w.id==="bible") ? "bible" : (ws[0] && ws[0].id);
  fillSelect($("text"), ws.map(w=>[w.id, w.title]), def);
  populateTranslations();
}
function populateTranslations(){
  const w = WORKS[$("text").value]; if(!w) return;
  const list = visTrans(w);
  if(!list.length) return;
  const def = (list.find(t=>/kjv|king-james/i.test(t.file)) || list[0]).file;
  fillSelect($("translation"), list.map(t=>[t.file, t.label]), def);
  loadText();
}

// ── load primary text ────────────────────────────────────────────────────────
async function loadText(){
  const id=$("text").value, file=$("translation").value, w=WORKS[id];
  status("Loading text…");
  const t = await getText(file);
  if(!t){ status("Could not load that text.", true); return; }
  const uniq = new Set(t.passages.map(p=>p.path.join("|"))).size === t.passages.length;
  CUR = { id, title:t.title||w.title, label:(w.trans.find(x=>x.file===file)||{}).label||t.title,
          hierarchy:t.hierarchy || w.hierarchy || ["section"], passages:t.passages, titles:t.titles||null,
          unique:uniq };
  override=null; $("ref").value="";
  if(mode==="parallel") populateCompare();
  buildNav();
  status("Ready · "+CUR.passages.length.toLocaleString()+" passages");
}

// ── compare (parallel) ───────────────────────────────────────────────────────
function populateCompare(){
  const w=WORKS[CUR.id], prim=$("translation").value;
  const others=visTrans(w).filter(t=>t.file!==prim);
  const box=$("compare");
  box.innerHTML = others.length
    ? others.map((t,i)=>`<label class="cbx"><input type="checkbox" value="${esc(t.file)}"${i===0?" checked":""}> ${esc(t.label)}</label>`).join("")
    : `<div class="hint">No other translations of this text.</div>`;
  box.querySelectorAll("input").forEach(cb=>cb.addEventListener("change", onCompareToggle));
  Promise.all([...box.querySelectorAll("input:checked")].map(cb=>getText(cb.value))).then(render);
}
async function onCompareToggle(e){ if(e.target.checked) await getText(e.target.value); render(); }
function compareChecked(){ return [...$("compare").querySelectorAll("input:checked")].map(c=>c.value); }

// ── structured navigation ────────────────────────────────────────────────────
function distinct(level, prefix){
  const out=[], seen=new Set();
  for(const p of CUR.passages){
    let ok = p.path.length > level;
    for(let i=0;i<prefix.length && ok;i++) if(String(p.path[i])!==String(prefix[i])) ok=false;
    if(!ok) continue;
    const v=p.path[level];
    if(!seen.has(String(v))){ seen.add(String(v)); out.push(v); }
  }
  return out;
}
const isNum = v => /^\d+$/.test(String(v));
function sectionTitle(v){ return (CUR.titles && CUR.titles[String(v)]) ? tc(CUR.titles[String(v)]) : null; }
function ancLabel(level, v){
  if(CUR.id==="bible" && level===0) return BOOK_NAMES[v] || v;
  if(CUR.id==="quran" && level===0) return "Surah "+(SURAH_NAMES[v]||v)+" ("+v+")";
  // numeric values get the level name ("Chapter 3"); already-named values
  // (e.g. "Book I", "Bu Pj 1") are shown as-is to avoid "Book Book I".
  let base = isNum(v) ? (cap(CUR.hierarchy[level]||"")+" "+v) : String(v);
  if(level===0){ const t=sectionTitle(v); if(t) base += " — "+t; }
  return base;
}
// Leaf (From/To) labels: for depth-1 texts the leaf IS the top section, so
// give it the rich label (name/title); deeper texts just show the verse number.
function leafLabel(v){ return CUR.hierarchy.length===1 ? ancLabel(0, v) : String(v); }
function ancSel(l){ return $("nav").querySelector(`select[data-level="${l}"]`); }
function buildIndexNav(nav){
  // Fallback for texts whose paths don't uniquely address passages (upstream
  // data quirk) — let the reader page through by passage position instead.
  const n=CUR.passages.length;
  const row=document.createElement("div"); row.className="row";
  const mk=(id,txt,def)=>{ const d=document.createElement("div"); const l=document.createElement("label");
    l.textContent=txt; const s=document.createElement("select"); s.id=id;
    let o=""; for(let i=0;i<n;i++) o+=`<option value="${i}">${i+1}</option>`;
    s.innerHTML=o; s.value=String(def);
    s.addEventListener("change",()=>{override=null;$("ref").value="";render();}); d.append(l,s); return d; };
  row.append(mk("fromSel","From passage",0), mk("toSel","To passage",Math.min(n-1,9)));
  nav.append(row);
  override=null; render();
}
function buildNav(){
  const nav=$("nav"); nav.innerHTML=""; ancVals=[];
  if(!CUR.unique){ buildIndexNav(nav); return; }
  const H=CUR.hierarchy, L=H.length;
  for(let lvl=0; lvl<L-1; lvl++){
    const wrap=document.createElement("div");
    const lab=document.createElement("label"); lab.textContent=cap(H[lvl]);
    const sel=document.createElement("select"); sel.dataset.level=lvl;
    sel.addEventListener("change", ()=>onAncChange(lvl));
    wrap.append(lab,sel); nav.append(wrap);
  }
  const row=document.createElement("div"); row.className="row";
  const mk=(id,txt)=>{ const d=document.createElement("div"); const l=document.createElement("label");
    l.textContent=txt; const s=document.createElement("select"); s.id=id;
    s.addEventListener("change",()=>{override=null;$("ref").value="";render();}); d.append(l,s); return d; };
  row.append(mk("fromSel","From "+H[L-1]), mk("toSel","To "+H[L-1]));
  nav.append(row);
  populateAnc(0);
}
function populateAnc(level){
  const L=CUR.hierarchy.length;
  if(level <= L-2){
    const sel=ancSel(level);
    const vals=distinct(level, ancVals.slice(0,level));
    sel.innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(ancLabel(level,v))}</option>`).join("");
    ancVals[level]=String(vals[0]);
    populateAnc(level+1);
  } else {
    const leaves=distinct(L-1, ancVals.slice(0,L-1));
    const opts=leaves.map(v=>`<option value="${esc(v)}">${esc(leafLabel(v))}</option>`).join("");
    $("fromSel").innerHTML=opts; $("toSel").innerHTML=opts;
    if(leaves.length){ $("fromSel").value=String(leaves[0]); $("toSel").value=String(leaves[leaves.length-1]); }
    override=null; render();
  }
}
function onAncChange(level){ ancVals[level]=ancSel(level).value; populateAnc(level+1); }

// ── order lookups + selection ────────────────────────────────────────────────
function exactOrder(comps){
  const p = CUR.passages.find(p => p.path.length===comps.length
            && comps.every((c,i)=>String(p.path[i])===String(c)));
  return p ? p.order : null;
}
function prefixRange(prefix){
  let lo=Infinity, hi=-Infinity;
  for(const p of CUR.passages) if(prefix.every((c,i)=>String(p.path[i])===String(c))){
    if(p.order<lo) lo=p.order; if(p.order>hi) hi=p.order;
  }
  return hi>=0 ? {first:lo,last:hi} : null;
}
function selFromControls(){
  if(!CUR.unique){
    const a=+$("fromSel").value, b=+$("toSel").value;
    if(isNaN(a)||isNaN(b)) return null;
    return {lo:Math.min(a,b), hi:Math.max(a,b), idx:true};
  }
  const L=CUR.hierarchy.length, prefix=ancVals.slice(0,L-1);
  const a=exactOrder([...prefix,$("fromSel").value]), b=exactOrder([...prefix,$("toSel").value]);
  if(a==null||b==null) return null;
  return {lo:Math.min(a,b), hi:Math.max(a,b)};
}
function parseRef(str){
  if(!CUR.unique){
    const sp=str.trim().split(/\s*[-–]\s*/); const a=parseInt(sp[0],10);
    if(isNaN(a)) return null;
    const n=CUR.passages.length, b=sp[1]!==undefined?parseInt(sp[1],10):a;
    const clamp=x=>Math.max(0,Math.min(n-1,(isNaN(x)?a:x)-1));
    const lo=clamp(a), hi=clamp(b);
    return {lo:Math.min(lo,hi), hi:Math.max(lo,hi), idx:true};
  }
  const L=CUR.hierarchy.length; let body=str.trim(); if(!body) return null; let lead=[];
  if(CUR.id==="bible"){
    const m=body.match(/^\s*(.+?)\s+(\d.*)$/); if(!m) return null;
    const abbr=BOOK_LOOKUP[m[1].toLowerCase().replace(/[^a-z0-9]/g,"")]; if(!abbr) return null;
    lead=[abbr]; body=m[2];
  }
  const sp=body.split(/\s*[-–]\s*/), aStr=sp[0], bStr=sp[1];
  const part=s=>s.split(/[:.]/).map(x=>x.trim()).filter(x=>x!=="");
  const start=lead.concat(part(aStr)); let lo,hi;
  if(start.length>=L) lo=exactOrder(start); else { const r=prefixRange(start); lo=r&&r.first; }
  if(bStr===undefined){ if(start.length>=L) hi=lo; else { const r=prefixRange(start); hi=r&&r.last; } }
  else { let end=part(bStr); if(end.length<start.length) end=start.slice(0,start.length-end.length).concat(end);
    if(end.length>=L) hi=exactOrder(end); else { const r=prefixRange(end); hi=r&&r.last; } }
  if(lo==null||hi==null) return null;
  return {lo:Math.min(lo,hi), hi:Math.max(lo,hi)};
}
function applyRef(){ const r=parseRef($("ref").value);
  if(!r){ status("Couldn't find that reference in this text.", true); return; } override=r; render(); }

// ── citation ─────────────────────────────────────────────────────────────────
function citation(sel){
  if(!CUR.unique){
    const i1=CUR.passages.indexOf(sel[0])+1, i2=CUR.passages.indexOf(sel[sel.length-1])+1;
    return i1===i2 ? `${CUR.title} ¶${i1}` : `${CUR.title} ¶${i1}–${i2}`;
  }
  const f=sel[0].path, l=sel[sel.length-1].path, id=CUR.id;
  if(id==="bible"){
    const bk=(f[0]==="psa"?"Psalm":BOOK_NAMES[f[0]]||f[0]);
    if(f[0]!==l[0]) return `${bk}–${BOOK_NAMES[l[0]]||l[0]}`;
    if(f[1]===l[1] && f[2]===l[2]) return `${bk} ${f[1]}:${f[2]}`;
    if(f[1]===l[1]) return `${bk} ${f[1]}:${f[2]}–${l[2]}`;
    return `${bk} ${f[1]}:${f[2]}–${l[1]}:${l[2]}`;
  }
  if(id==="quran"){
    const nm=SURAH_NAMES[f[0]]?`Surah ${SURAH_NAMES[f[0]]} `:"Surah ";
    if(f[0]===l[0]) return f[1]===l[1] ? `${nm}${f[0]}:${f[1]}` : `${nm}${f[0]}:${f[1]}–${l[1]}`;
    return `${nm}${f[0]}:${f[1]}–${l[0]}:${l[1]}`;
  }
  const d=f.length, T=CUR.title;
  if(d===1) return f[0]===l[0] ? `${T} ${f[0]}` : `${T} ${f[0]}–${l[0]}`;
  const fa=f.slice(0,-1).join(":"), la=l.slice(0,-1).join(":");
  if(fa===la) return f[d-1]===l[d-1] ? `${T} ${fa}:${f[d-1]}` : `${T} ${fa}:${f[d-1]}–${l[d-1]}`;
  return `${T} ${fa}:${f[d-1]}–${la}:${l[d-1]}`;
}

// ── render ───────────────────────────────────────────────────────────────────
function render(){
  if(!CUR) return;
  const r=override||selFromControls(); if(!r) return;
  const sel = r.idx ? CUR.passages.slice(r.lo, r.hi+1)
                    : CUR.passages.filter(p=>p.order>=r.lo && p.order<=r.hi);
  if(!sel.length) return;
  const ref=citation(sel), page=$("page");
  page.className=ST.size+" "+ST.fam;
  page.style.setProperty("--fs", ST.fs+"pt");
  page.style.setProperty("--lh", ST.lh);
  if(mode==="parallel") renderParallel(sel, ref); else renderSingle(sel, ref);
  document.title="The Press — "+ref;
}
function renderSingle(sel, ref){
  const L=CUR.hierarchy.length;
  const lines = ST.layout==="lines";
  const sectionKey=p=>p.path.slice(0,-1).join("|");
  const multi = L>1 && new Set(sel.map(sectionKey)).size>1;
  const secVal = L>1 ? sel[0].path[L-2] : sel[0].path[0];
  const secName = (!multi && CUR.id!=="bible") ? sectionTitle(secVal) : null;
  const sub = secName ? `${esc(secName)} · ${esc(CUR.label)}` : esc(CUR.label);
  let html=`<div class="ttl">${esc(ref)}</div><div class="sub">${sub}</div><hr>`;
  const base = CUR.unique ? 0 : CUR.passages.indexOf(sel[0]);
  let curKey=null, buf=[];
  const flush=()=>{ if(buf.length){ html+=`<div class="body${ST.just?" just":""}">${buf.join(" ")}</div>`; buf=[]; } };
  sel.forEach((p,i)=>{
    if(multi){ const k=sectionKey(p); if(k!==curKey){ if(!lines) flush(); curKey=k;
      let lab = CUR.id==="bible" ? (BOOK_NAMES[p.path[0]]||p.path[0])+" "+p.path[1] : cap(CUR.hierarchy[L-2]||"")+" "+p.path[L-2];
      if(CUR.id!=="bible"){ const t=sectionTitle(p.path[L-2]); if(t) lab += " — "+t; }
      html+=`<div class="chap">${esc(lab)}</div>`; } }
    const marker = CUR.unique ? p.path[L-1] : (base+i+1);
    const cell=`<span class="vn">${esc(marker)}</span> ${esc(p.text)}`;
    if(lines) html+=`<div class="line${ST.just?" just":""}">${cell}</div>`;
    else buf.push(cell);
  });
  if(!lines) flush();
  html+=`<hr><div class="foot">${esc(ref)} · ${esc(CUR.label)} · Digital Archive</div>`;
  $("page").innerHTML=html;
  status(ref+" · "+sel.length+(sel.length===1?" passage":" passages"));
}
function renderParallel(sel, ref){
  const L=CUR.hierarchy.length, prim=$("translation").value;
  const cols=[prim, ...compareChecked().filter(f=>f!==prim)];
  const w=WORKS[CUR.id];
  const labelFor=f=>(w.trans.find(t=>t.file===f)||{}).label||f;
  let html=`<div class="ttl">${esc(ref)}</div><div class="sub">Parallel · ${cols.length} translation${cols.length===1?"":"s"}</div><hr>`;
  html+=`<table class="par"><thead><tr><th class="vh"></th>`+cols.map(f=>`<th>${esc(labelFor(f))}</th>`).join("")+`</tr></thead><tbody>`;
  for(const p of sel){
    const key=p.path.join("|");
    html+=`<tr><td class="vh">${esc(p.path[L-1])}</td>`+cols.map(f=>{
      const txt = f===prim ? p.text : ((TEXTCACHE[f]&&TEXTCACHE[f].byKey[key]) || "—");
      return `<td>${esc(txt)}</td>`;
    }).join("")+`</tr>`;
  }
  html+=`</tbody></table><hr><div class="foot">${esc(ref)} · parallel · Digital Archive</div>`;
  $("page").innerHTML=html;
  status(ref+" · "+sel.length+" × "+cols.length+" translations");
}

// ── controls wiring ──────────────────────────────────────────────────────────
function syncSize(){ [...$("sizeSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.size===ST.size)); }
$("showall").onchange = e=>{ SHOWALL=e.target.checked; populateTraditions(); };
$("tradition").onchange = populateTexts;
$("text").onchange = populateTranslations;
$("translation").onchange = ()=>{ loadText(); };
$("modeSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  mode=b.dataset.mode; [...$("modeSeg").children].forEach(x=>x.classList.toggle("on",x===b));
  $("compareSec").style.display = mode==="parallel" ? "block" : "none";
  if(mode==="parallel"){ if(ST.size==="a6"||ST.size==="receipt"){ ST.size="a4"; syncSize(); } populateCompare(); }
  else render();
};
$("refgo").onclick = applyRef;
$("ref").addEventListener("keydown", e=>{ if(e.key==="Enter") applyRef(); });
$("sizeSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  ST.size=b.dataset.size; syncSize(); render(); };
$("famSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  ST.fam=b.dataset.fam; [...$("famSeg").children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
$("layoutSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return;
  ST.layout=b.dataset.layout; [...$("layoutSeg").children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
$("fs").oninput = e=>{ ST.fs=parseFloat(e.target.value); $("fsVal").textContent=ST.fs; render(); };
$("lh").oninput = e=>{ ST.lh=parseFloat(e.target.value); $("lhVal").textContent=ST.lh; render(); };
$("justify").onchange = e=>{ ST.just=e.target.checked; render(); };
$("print").onclick = ()=>{
  const css={a6:"A6",a5:"A5",a4:"A4",letter:"Letter",receipt:"80mm auto"}[ST.size];
  const marg={a6:"8mm",a5:"12mm",a4:"14mm",letter:"14mm",receipt:"5mm"}[ST.size];
  let st=$("pagecss"); if(!st){ st=document.createElement("style"); st.id="pagecss"; document.head.appendChild(st); }
  st.textContent=`@page{ size:${css}; margin:${marg}; }`;
  window.print();
};

loadCatalog();
</script>
